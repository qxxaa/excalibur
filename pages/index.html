<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot API Usage Dashboard</title>

    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' http: https:; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <link rel="stylesheet" href="./usage-viewer-assets/utilities.css" />
    <link rel="stylesheet" href="./usage-viewer-assets/viewer.css" />
    <script defer src="./usage-viewer-assets/icons.js"></script>
    <script defer src="./usage-viewer-assets/viewer.js"></script>
  </head>
  <body class="antialiased">
    <div id="app" class="app-shell">
      <div class="main-shell">
        <header class="topbar">
          <div class="topbar-row">
            <div>
              <h1 class="page-title">Token Usage</h1>
              <p class="page-subtitle">Copilot quota and token billing dashboard</p>
            </div>
          </div>

          <form id="endpoint-form" class="control-surface">
            <div class="endpoint-field">
              <label for="endpoint-url" class="field-label">Usage Endpoint URL</label>
              <input
                type="text"
                id="endpoint-url"
                class="input-control input-focus"
                placeholder="http://localhost:4141/usage"
              />
            </div>
            <div>
              <label for="x-api-key" class="field-label">Auth credential</label>
              <input
                type="password"
                id="x-api-key"
                class="input-control input-focus"
                placeholder="x-api-key or Authorization Bearer"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div>
              <label for="token-usage-period" class="field-label">Period</label>
              <select
                id="token-usage-period"
                class="select-control input-focus"
              >
                <option value="today">Today</option>
                <option value="this_week">This week</option>
                <option value="last_7_days">Last 7 days</option>
                <option value="this_month">This month</option>
                <option value="last_30_days">Last 30 days</option>
                <option value="lifetime">Lifetime</option>
              </select>
            </div>
            <button id="fetch-button" type="submit" class="primary-action">
              <i data-lucide="refresh-cw" class="h-4 w-4"></i>
              <span>Refresh</span>
            </button>
          </form>
          <label class="mt-2 flex items-center gap-2 text-xs" style="color: var(--color-gray);">
            <input type="checkbox" id="remember-credential" />
            Remember this gateway key in this browser for this endpoint origin
          </label>
          <p class="mt-2 text-xs" style="color: var(--color-gray);">
            Keys stay in memory unless remembering is enabled. Saved keys are accessible to scripts on this origin.
            Previously saved keys require re-entry. External endpoints require an explicit Refresh.
          </p>
        </header>

        <main id="content-area" class="content-area"></main>
      </div>
    </div>


  </body>
</html>
